<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="claude:viewport-fit-sides" content="cover">
  <title>笔哩 iOS 原型</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap">
  <style>
    /* Native app canvas in the center, flow index and rationale beside it. */
    :root {
      color-scheme: light;
      --bg: #f5f3f5;
      --surface: #ffffff;
      --surface-2: #eeebef;
      --ink: #262229;
      --muted: #756e79;
      --line: #ded8e0;
      --brand: #b33f66;
      --brand-soft: #f5e5eb;
      --success: #31785a;
      --danger: #c64552;
      --warning: #9a661c;
      --on-accent: #ffffff;
      --device: #1c181e;
      --shadow: rgba(46, 31, 42, .14);
      --font-ui: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      --font-display: "Noto Serif SC", "Songti SC", serif;
      --font-native: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #171419;
        --surface: #242027;
        --surface-2: #302b33;
        --ink: #f3eef4;
        --muted: #b0a7b4;
        --line: #403946;
        --brand: #f29cb4;
        --brand-soft: #492c3a;
        --success: #7fc6a5;
        --danger: #ff8d98;
        --warning: #e4b56d;
        --on-accent: #24161d;
        --device: #09080a;
        --shadow: rgba(0, 0, 0, .34);
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #171419;
      --surface: #242027;
      --surface-2: #302b33;
      --ink: #f3eef4;
      --muted: #b0a7b4;
      --line: #403946;
      --brand: #f29cb4;
      --brand-soft: #492c3a;
      --success: #7fc6a5;
      --danger: #ff8d98;
      --warning: #e4b56d;
      --on-accent: #24161d;
      --device: #09080a;
      --shadow: rgba(0, 0, 0, .34);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100%;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 48%, transparent); outline-offset: 3px; }
    button { -webkit-tap-highlight-color: transparent; }
    .page-header {
      max-width: 1180px;
      margin: 0 auto;
      padding-block: 28px 22px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand-mark { width: 46px; height: 46px; border-radius: 12px; box-shadow: 0 5px 16px var(--shadow); }
    .header-copy { display: grid; gap: 3px; }
    .header-copy h1 { margin: 0; font: 700 24px/1.25 var(--font-display); letter-spacing: -.02em; }
    .header-copy p { margin: 0; color: var(--muted); font-size: 13px; }
    .scope-badge { margin-left: auto; padding: 7px 11px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .workspace {
      max-width: 1180px;
      margin: 0 auto;
      padding-bottom: 40px;
      display: grid;
      grid-template-columns: 210px 410px minmax(250px, 1fr);
      align-items: start;
      gap: 28px;
    }
    .flow-index { position: sticky; top: 20px; display: grid; gap: 18px; }
    .flow-group { display: grid; gap: 5px; }
    .flow-label { padding: 0 10px 5px; color: var(--muted); font-size: 12px; font-weight: 600; }
    .flow-button {
      width: 100%;
      min-height: 42px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      text-align: left;
      font-size: 14px;
      cursor: pointer;
    }
    .flow-button:hover { background: var(--surface-2); }
    .flow-button.active { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
    .flow-button svg { width: 17px; height: 17px; flex: none; }
    .prototype-caption { padding: 0 10px; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .device-wrap { display: grid; justify-items: center; gap: 12px; }
    .device {
      width: 410px;
      height: 864px;
      padding: 10px;
      border-radius: 54px;
      background: var(--device);
      box-shadow: 0 24px 60px var(--shadow), inset 0 0 0 1px color-mix(in srgb, var(--surface) 15%, transparent);
    }
    .phone {
      position: relative;
      height: 100%;
      overflow: hidden;
      border-radius: 44px;
      background: var(--surface);
      color: var(--ink);
      font-family: var(--font-native);
      font-size: 14px;
      isolation: isolate;
    }
    .device-note { color: var(--muted); font-size: 12px; }
    .screen { height: 100%; display: flex; flex-direction: column; background: var(--surface); }
    .statusbar {
      height: 36px;
      flex: none;
      padding: 10px 22px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .status-icons { display: flex; align-items: center; gap: 6px; }
    .status-icons svg { width: 15px; height: 15px; }
    .nav {
      min-height: 50px;
      flex: none;
      padding: 7px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid transparent;
    }
    .nav.large { min-height: 62px; align-items: flex-end; padding-bottom: 9px; }
    .nav.inline { border-bottom-color: var(--line); }
    .nav h2 { margin: 0; font-size: 29px; line-height: 1.15; letter-spacing: -.5px; text-wrap: balance; }
    .nav.inline h2 { font-size: 16px; letter-spacing: 0; text-align: center; flex: 1; }
    .nav-spacer { flex: 1; }
    .icon-button {
      width: 36px;
      height: 36px;
      padding: 0;
      display: inline-grid;
      place-items: center;
      flex: none;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--brand);
      cursor: pointer;
    }
    .icon-button:hover { background: var(--brand-soft); }
    .icon-button svg { width: 21px; height: 21px; }
    .text-button {
      min-height: 36px;
      padding: 6px 0;
      border: 0;
      background: transparent;
      color: var(--brand);
      font-weight: 500;
      cursor: pointer;
    }
    .text-button.danger { color: var(--danger); }
    .back-button { display: inline-flex; align-items: center; gap: 2px; min-width: 54px; }
    .back-button svg { width: 18px; height: 18px; }
    .content { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
    .content::-webkit-scrollbar { display: none; }
    .content.grouped { background: var(--bg); }
    .content-pad { padding: 0 18px 22px; display: grid; gap: 16px; }
    .search-box {
      height: 38px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 11px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 14px;
    }
    .search-box svg { width: 17px; height: 17px; flex: none; }
    .search-box strong { color: var(--ink); font-weight: 400; }
    .search-box .cancel { margin-left: auto; color: var(--brand); font-size: 12px; }
    .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      min-height: 32px;
      padding: 6px 11px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
    }
    .chip.active { border-color: transparent; background: var(--brand-soft); color: var(--brand); font-weight: 600; }
    .chip svg { width: 13px; height: 13px; }
    .segmented { padding: 3px; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; border-radius: 10px; background: var(--surface-2); }
    .segment { min-height: 30px; padding: 5px 7px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; }
    .segment.active { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 4px var(--shadow); }
    .section-title { padding: 2px 2px 0; display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 12px; font-weight: 600; }
    .active-strip {
      width: 100%;
      padding: 13px 14px;
      display: flex;
      align-items: center;
      gap: 11px;
      border: 0;
      border-radius: 13px;
      background: var(--brand-soft);
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }
    .active-strip svg { width: 21px; height: 21px; color: var(--brand); flex: none; }
    .active-strip .grow, .row-copy { flex: 1; min-width: 0; }
    .active-strip strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
    .active-strip small { display: block; margin-top: 3px; color: var(--brand); font-size: 11px; }
    .list { overflow: hidden; border-top: 1px solid var(--line); }
    .note-row, .task-row, .video-row, .trash-row {
      position: relative;
      width: 100%;
      padding: 14px 0;
      display: flex;
      gap: 12px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      text-align: left;
    }
    button.note-row, button.task-row, button.video-row { cursor: pointer; }
    .row-copy { display: grid; align-content: start; gap: 6px; }
    .row-title { font-size: 15px; font-weight: 600; line-height: 1.45; text-wrap: pretty; }
    .row-summary { display: -webkit-box; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 2; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .meta { display: flex; align-items: center; flex-wrap: wrap; gap: 5px 9px; color: var(--muted); font-size: 11px; line-height: 1.4; }
    .meta .spacer { flex: 1; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag { padding: 3px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); font-size: 10px; }
    button.tag { border: 0; cursor: pointer; }
    .status { display: inline-flex; align-items: center; gap: 4px; flex: none; padding: 4px 7px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); font-size: 10px; font-weight: 600; white-space: nowrap; }
    .status.success { background: color-mix(in srgb, var(--success) 12%, var(--surface)); color: var(--success); }
    .status.failed { background: color-mix(in srgb, var(--danger) 12%, var(--surface)); color: var(--danger); }
    .status.neutral { background: var(--surface-2); color: var(--muted); }
    .status svg { width: 12px; height: 12px; }
    .tabbar {
      height: 67px;
      flex: none;
      padding: 7px 20px 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      backdrop-filter: blur(18px);
    }
    .tab { display: grid; place-items: center; align-content: center; gap: 3px; border: 0; background: transparent; color: var(--muted); font-size: 10px; cursor: pointer; }
    .tab.active { color: var(--brand); }
    .tab svg { width: 22px; height: 22px; }
    .home-indicator { position: absolute; z-index: 20; bottom: 5px; left: 50%; width: 120px; height: 4px; transform: translateX(-50%); border-radius: 999px; background: var(--ink); opacity: .75; pointer-events: none; }
    .search-result { padding: 15px 0; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
    .hit {
      width: 100%;
      padding: 11px 12px;
      display: grid;
      gap: 6px;
      border: 0;
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }
    .hit-label { display: flex; justify-content: space-between; color: var(--brand); font-size: 11px; font-weight: 600; }
    .hit p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.65; }
    mark { padding: 0 2px; border-radius: 3px; background: color-mix(in srgb, var(--brand) 20%, transparent); color: var(--ink); }
    .task-check { width: 22px; height: 22px; margin-top: 3px; display: grid; place-items: center; flex: none; border: 1.5px solid var(--line); border-radius: 50%; color: var(--surface); }
    .task-check.checked { border-color: var(--brand); background: var(--brand); }
    .task-check svg { width: 14px; height: 14px; }
    .selection-bar { padding: 12px 18px 18px; display: flex; align-items: center; gap: 12px; border-top: 1px solid var(--line); background: var(--surface); }
    .selection-bar strong { flex: 1; font-size: 13px; }
    .detail-head { display: grid; gap: 10px; text-align: center; justify-items: center; padding-block: 6px 4px; }
    .detail-head h3 { margin: 0; font-size: 21px; line-height: 1.4; text-wrap: balance; }
    .detail-head p { margin: 0; color: var(--muted); font-size: 12px; }
    .progress-card { padding: 16px; display: grid; gap: 14px; border-radius: 14px; background: var(--surface); }
    .step { display: grid; grid-template-columns: 24px 1fr auto; align-items: start; gap: 10px; }
    .step-icon { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; background: var(--surface-2); color: var(--muted); }
    .step.done .step-icon { background: color-mix(in srgb, var(--success) 14%, var(--surface)); color: var(--success); }
    .step.current .step-icon { background: var(--brand-soft); color: var(--brand); }
    .step-icon svg { width: 13px; height: 13px; }
    .step-copy strong { display: block; font-size: 13px; }
    .step-copy small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .step-value { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .progress-track { height: 5px; margin-top: 9px; overflow: hidden; border-radius: 99px; background: var(--surface-2); }
    .progress-track > span { display: block; height: 100%; border-radius: inherit; background: var(--brand); }
    .live-preview { padding: 15px; display: grid; gap: 9px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
    .live-preview h4 { margin: 0; font-size: 13px; }
    .live-preview p { margin: 0; color: var(--muted); font: 12px/1.75 var(--font-display); }
    .live-dot { display: inline-block; width: 6px; height: 6px; margin-right: 5px; border-radius: 50%; background: var(--brand); }
    .primary-button, .secondary-button {
      width: 100%;
      min-height: 46px;
      padding: 11px 16px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .primary-button { border: 0; background: var(--brand); color: var(--on-accent); }
    .secondary-button { border: 1px solid var(--line); background: var(--surface); color: var(--brand); }
    .secondary-button.danger { color: var(--danger); }
    .button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .error-box { padding: 13px; display: grid; gap: 7px; border-radius: 12px; background: color-mix(in srgb, var(--danger) 10%, var(--surface)); color: var(--danger); font-size: 12px; line-height: 1.55; }
    .error-box code { color: var(--muted); font-size: 10px; user-select: all; }
    .reader { font-family: var(--font-display); }
    .reader-title { margin: 0; font-size: 24px; line-height: 1.45; text-wrap: balance; }
    .reader-body { display: grid; gap: 16px; font-size: calc(14px * var(--reader-scale, 1)); line-height: 1.95; }
    .reader-body p, .reader-body h3 { margin: 0; }
    .reader-body h3 { padding-top: 8px; font-size: 17px; }
    .match-bar { margin: 0 18px 12px; padding: 9px 12px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); box-shadow: 0 6px 20px var(--shadow); color: var(--muted); font-size: 11px; }
    .match-bar strong { flex: 1; color: var(--ink); font-weight: 500; }
    .match-bar .icon-button { width: 28px; height: 28px; }
    .author-card { padding: 16px 0; display: flex; align-items: center; gap: 12px; }
    .avatar { width: 52px; height: 52px; display: grid; place-items: center; flex: none; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font: 700 22px var(--font-display); }
    .author-card h3 { margin: 0 0 4px; font-size: 18px; }
    .author-card p { margin: 0; color: var(--muted); font-size: 11px; }
    .video-row { align-items: flex-start; }
    .video-thumb { width: 88px; aspect-ratio: 16/10; max-width: 100%; display: grid; place-items: center; flex: none; border-radius: 8px; background: var(--surface-2); color: var(--muted); }
    .video-thumb svg { width: 24px; height: 24px; }
    .video-row .row-title { font-size: 13px; }
    .row-action { align-self: center; flex: none; padding: 7px 9px; border: 0; border-radius: 8px; background: var(--brand-soft); color: var(--brand); font-size: 11px; font-weight: 600; cursor: pointer; }
    .trash-row { align-items: center; }
    .days { flex: none; color: var(--warning); font-size: 11px; white-space: nowrap; }
    .swipe-demo { display: grid; grid-template-columns: 1fr 74px 74px; align-items: stretch; overflow: hidden; border-bottom: 1px solid var(--line); }
    .swipe-demo .trash-row { padding-left: 4px; border: 0; }
    .swipe-action { display: grid; place-items: center; border: 0; color: var(--on-accent); font-size: 12px; cursor: pointer; }
    .swipe-action.restore { background: var(--brand); }
    .swipe-action.delete { background: var(--danger); }
    .sheet-backdrop { position: absolute; z-index: 30; inset: 0; display: flex; align-items: flex-end; background: rgba(10, 7, 11, .38); }
    .sheet { width: 100%; max-height: 88%; overflow-y: auto; padding: 10px 18px 24px; border-radius: 22px 22px 0 0; background: var(--surface); box-shadow: 0 -12px 40px var(--shadow); }
    .grabber { width: 38px; height: 5px; margin: 0 auto 16px; border-radius: 99px; background: var(--line); }
    .sheet-head { display: flex; align-items: center; gap: 10px; }
    .sheet-head h3 { margin: 0; flex: 1; font-size: 19px; }
    .sheet p { color: var(--muted); font-size: 12px; line-height: 1.65; }
    .field { display: grid; gap: 7px; }
    .field label { color: var(--muted); font-size: 11px; }
    .url-field { min-height: 45px; padding: 10px 12px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--brand); border-radius: 11px; background: var(--surface); color: var(--ink); font-size: 12px; }
    .url-field span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .url-field svg { width: 17px; height: 17px; flex: none; color: var(--brand); }
    .source-preview { padding: 12px; display: flex; align-items: center; gap: 10px; border-radius: 11px; background: var(--surface-2); }
    .source-preview svg { width: 22px; height: 22px; color: var(--brand); }
    .source-preview strong { display: block; font-size: 12px; }
    .source-preview small { display: block; margin-top: 3px; color: var(--success); font-size: 10px; }
    .toggle-row { min-height: 42px; display: flex; align-items: center; gap: 12px; }
    .toggle-row span { flex: 1; font-size: 13px; }
    .toggle { width: 42px; height: 25px; padding: 2px; border: 0; border-radius: 99px; background: var(--success); cursor: pointer; }
    .toggle::after { content: ""; display: block; width: 21px; height: 21px; margin-left: 17px; border-radius: 50%; background: #fff; }
    .sheet-actions { display: grid; gap: 9px; margin-top: 14px; }
    .action-list { margin: 14px -18px -24px; display: grid; }
    .action-list button { min-height: 50px; padding: 12px 18px; border: 0; border-top: 1px solid var(--line); background: var(--surface); color: var(--brand); cursor: pointer; }
    .action-list button.danger { color: var(--danger); }
    .action-list button.cancel { color: var(--ink); font-weight: 600; }
    .toast { position: absolute; z-index: 50; left: 18px; right: 18px; bottom: 78px; min-height: 45px; padding: 11px 14px; display: flex; align-items: center; gap: 10px; border-radius: 12px; background: var(--device); color: #f8f3f8; box-shadow: 0 8px 28px var(--shadow); font-size: 12px; }
    .toast span { flex: 1; }
    .toast button { border: 0; background: transparent; color: #f29cb4; font-weight: 600; cursor: pointer; }
    .notes-panel { position: sticky; top: 20px; display: grid; gap: 20px; }
    .notes-head { display: grid; gap: 7px; }
    .notes-head .kicker { color: var(--brand); font-size: 12px; font-weight: 600; }
    .notes-head h2 { margin: 0; font: 700 23px/1.35 var(--font-display); text-wrap: balance; }
    .notes-head p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .note-section { padding-top: 16px; display: grid; gap: 9px; border-top: 1px solid var(--line); }
    .note-section h3 { margin: 0; font-size: 13px; }
    .note-section ul { margin: 0; padding: 0; display: grid; gap: 9px; list-style: none; }
    .note-section li { position: relative; padding-left: 15px; color: var(--muted); font-size: 12px; line-height: 1.75; }
    .note-section li::before { content: ""; position: absolute; top: .75em; left: 0; width: 5px; height: 5px; border-radius: 50%; background: var(--brand); }
    .native-note { padding: 13px 14px; border-left: 3px solid var(--brand); background: var(--brand-soft); color: var(--muted); font-size: 12px; line-height: 1.7; }
    .implementation-order { max-width: 1180px; margin: 0 auto; padding: 24px 0 36px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 180px 1fr; gap: 24px; }
    .implementation-order h2 { margin: 0; font: 700 18px var(--font-display); }
    .order-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .order-item { display: grid; gap: 5px; }
    .order-item strong { color: var(--brand); font-size: 12px; }
    .order-item span { color: var(--muted); font-size: 12px; line-height: 1.65; }
    .load-more { width: 100%; min-height: 46px; border: 0; background: transparent; color: var(--brand); font-size: 13px; font-weight: 600; cursor: pointer; }
    .settings-group { overflow: hidden; border: 1px solid var(--line); border-radius: 13px; background: var(--surface); }
    .settings-row { width: 100%; min-height: 49px; padding: 10px 13px; display: flex; align-items: center; gap: 10px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); text-align: left; }
    .settings-row:last-child { border-bottom: 0; }

    .settings-row .grow { flex: 1; min-width: 0; }
    .settings-row strong { display: block; font-size: 13px; font-weight: 500; }
    .settings-row small { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; line-height: 1.45; }
    .settings-value { color: var(--muted); font-size: 11px; white-space: nowrap; }
    .setting-icon { width: 29px; height: 29px; display: grid; place-items: center; flex: none; border-radius: 8px; background: var(--brand-soft); color: var(--brand); }
    .setting-icon svg { width: 16px; height: 16px; }
    .form-field { display: grid; gap: 7px; color: var(--muted); font-size: 11px; }
    .form-field input { width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); color: var(--ink); font-size: 12px; }
    .info-band { padding: 12px 13px; border-radius: 11px; background: var(--surface-2); color: var(--muted); font-size: 11px; line-height: 1.6; }
    .app-icon-large { width: 82px; height: 82px; border-radius: 20px; box-shadow: 0 8px 24px var(--shadow); }
    .empty-state { min-height: 420px; padding: 52px 20px; display: grid; align-content: center; justify-items: center; gap: 12px; text-align: center; }
    .empty-state h3 { margin: 0; font-size: 20px; }
    .empty-state p { margin: 0; max-width: 270px; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .skeletons { display: grid; gap: 22px; padding-top: 12px; }
    .skeleton { display: grid; gap: 9px; }
    .skeleton span { display: block; height: 12px; border-radius: 6px; background: var(--surface-2); }
    .skeleton span:first-child { width: 84%; height: 17px; }
    .skeleton span:last-child { width: 52%; }
    .cue-list { display: grid; }
    .cue { padding: 12px 2px; display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 10px; border-bottom: 1px solid var(--line); font-size: calc(13px * var(--reader-scale, 1)); line-height: 1.7; }
    .timestamp { padding: 2px 0; border: 0; background: transparent; color: var(--brand); text-align: left; font-size: 11px; font-variant-numeric: tabular-nums; cursor: pointer; }
    .directory-link { min-height: 45px; padding: 10px 0; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); text-align: left; cursor: pointer; }
    svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    @media (max-width: 1040px) {
      .workspace { grid-template-columns: 170px 410px; justify-content: center; }
      .notes-panel { position: static; grid-column: 1 / -1; grid-template-columns: 1fr 1fr; max-width: 760px; margin: 0 auto; }
      .notes-head { grid-column: 1 / -1; }
      .implementation-order { grid-template-columns: 1fr; }
    }
    @media (max-width: 700px) {
      .page-header { padding-block: 20px 16px; }
      .header-copy h1 { font-size: 20px; }
      .scope-badge { display: none; }
      .workspace { display: flex; flex-direction: column; gap: 18px; }
      .flow-index { position: static; width: 100%; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
      .flow-group { display: contents; }
      .flow-label, .prototype-caption { display: none; }
      .flow-button { width: auto; min-width: max-content; min-height: 38px; padding: 8px 12px; background: var(--surface); }
      .flow-button svg { display: none; }
      .device { width: min(100%, 410px); height: min(844px, calc(100dvh - 120px)); min-height: 640px; border-radius: 42px; padding: 6px; }
      .phone { border-radius: 36px; }
      .notes-panel { width: 100%; display: grid; grid-template-columns: 1fr; }
      .order-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 390px) {
      body { padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); }
      .brand-mark { width: 40px; height: 40px; }
      .device { min-height: 620px; }
      .video-thumb { width: 72px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .sheet { animation: sheet-in .22s ease-out; }
      .toast { animation: toast-in .18s ease-out; }
      @keyframes sheet-in { from { transform: translateY(24px); opacity: .7; } to { transform: translateY(0); opacity: 1; } }
      @keyframes toast-in { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    }

    }

    function failedScreen() {
      return `${statusBar()}${nav("任务详情", { inline: true, back: "tasks", backLabel: "任务" })}<div class="content grouped"><div class="content-pad"><div class="detail-head"><h3>个人知识库的未来形态</h3><p>李自然说 · Bilibili</p>${status("生成失败", "failed")}</div><div class="error-box"><strong>生成字幕时连接中断</strong><span>已保留视频信息，可以直接重试当前任务。</span><code>JOB 8F2A-41C · TRANSCRIBING</code></div><button class="primary-button" data-action="retry">重试任务</button><button class="secondary-button" data-action="copy-error">复制错误详情</button><button class="text-button danger" data-action="delete-single">删除任务记录</button></div></div><div class="home-indicator"></div>`;
    }

    function settingsScreen() {
      return `${statusBar()}${nav("设置", {})}<div class="content grouped"><div class="content-pad">
        <div class="section-title"><span>连接</span></div><div class="settings-group"><button class="settings-row" data-go="server"><span class="setting-icon">${icon("link")}</span><span class="grow"><strong>服务器</strong><small>查看或更改连接</small></span>${icon("chevron")}</button></div>
        <div class="section-title"><span>内容管理</span></div><div class="settings-group"><button class="settings-row" data-go="trash"><span class="setting-icon">${icon("trash")}</span><span class="grow"><strong>回收站</strong><small>恢复或彻底删除已移除的笔记</small></span><span class="settings-value">2 篇</span>${icon("chevron")}</button></div>
        <div class="section-title"><span>外观与阅读</span></div><div class="settings-group"><div style="padding:11px 12px"><div class="segmented">${[["system", "自动"], ["light", "浅色"], ["dark", "深色"]].map(([key, label]) => `<button class="segment ${state.theme === key ? "active" : ""}" data-action="theme" data-value="${key}">${label}</button>`).join("")}</div></div><button class="settings-row" data-action="font-size"><span class="setting-icon">Aa</span><span class="grow"><strong>正文字号</strong><small>同时作用于笔记和字幕</small></span><span class="settings-value">${state.readerScale > 1 ? "大" : state.readerScale < 1 ? "小" : "标准"}</span>${icon("chevron")}</button></div>
        <div class="section-title"><span>关于</span></div><div class="settings-group"><div class="settings-row"><span class="grow"><strong>应用</strong></span><span class="settings-value">笔哩</span></div><div class="settings-row"><span class="grow"><strong>版本</strong></span><span class="settings-value">0.1.0</span></div></div><p style="margin:0;color:var(--muted);font-size:11px;line-height:1.6">查看和生成笔记、字幕，管理任务进度与已保存内容。</p>
      </div></div>${tabBar("settings")}`;
    }

    function serverScreen(initial = false) {
      const showConnect = initial || !state.connected;
      return `${statusBar()}${nav(initial ? "连接服务器" : "服务器", { inline: !initial, back: initial ? null : "settings", backLabel: "设置" })}<div class="content ${initial ? "" : "grouped"}"><form class="content-pad" id="server-form" data-initial="${initial}">
        ${initial ? `<div class="empty-state" style="min-height:0;padding:18px 20px 8px"><img class="app-icon-large" src="Biri/Assets.xcassets/AppIcon.appiconset/icon-1024.png" alt="笔哩"><p>查看和生成笔记、字幕，随时掌握任务进度。</p></div>` : ""}
        <label class="form-field" for="server-address">服务器地址<input id="server-address" type="url" value="https://api.example.com" autocomplete="off"></label>
        <label class="form-field" for="server-token">访问令牌（API Token）<input id="server-token" type="password" placeholder="${state.hasToken && !initial ? "输入新 Token 以更换" : "服务器未启用访问验证时可留空"}" autocomplete="off"></label>
        ${state.hasToken && !initial ? `<div class="settings-group"><div class="settings-row"><span class="grow"><strong>已保存的 Token</strong></span><span class="settings-value">••••••••</span></div><button class="settings-row" type="button" data-action="remove-token"><span class="grow" style="color:var(--danger)"><strong>移除 Token</strong></span></button></div>` : ""}
        <div class="info-band">Token 仅安全保存在此 iPhone，不会同步到 iCloud。原型不会收集或保存真实 Token。</div>
        ${state.connected && !initial ? `<div class="settings-group"><div class="settings-row"><span class="grow"><strong>状态</strong></span><span class="settings-value" style="color:var(--success)">已连接</span></div><div class="settings-row"><span class="grow"><strong>访问验证</strong></span><span class="settings-value">需要 Token</span></div><div class="settings-row"><span class="grow"><strong>全文搜索</strong></span><span class="settings-value">已启用</span></div></div>` : ""}
        <button class="primary-button" id="connect-submit" type="submit" ${showConnect ? "" : "hidden"}>${state.connected ? "保存并重新连接" : "连接"}</button>
      </form></div>${initial ? `<div class="home-indicator"></div>` : tabBar("settings")}`;
    }

    function loadingScreen() {
      return `${statusBar()}${nav("全部笔记（128）", {})}<div class="content"><div class="content-pad"><div class="search-box">${icon("search")}<span>搜索标题、正文和字幕</span></div><div class="skeletons">${Array(5).fill(`<div class="skeleton"><span></span><span></span><span></span></div>`).join("")}</div></div></div>${tabBar("library")}`;
    }
    function emptyScreen() {
      return `${statusBar()}${nav("笔记", { action: `<button class="icon-button" data-go="create">${icon("plus")}</button>` })}<div class="content"><div class="empty-state"><img class="app-icon-large" src="Biri/Assets.xcassets/AppIcon.appiconset/icon-1024.png" alt=""><h3>还没有笔记</h3><p>粘贴 Bilibili 或 YouTube 视频链接，生成第一篇笔记。</p><button class="primary-button" data-go="create" style="width:auto">生成第一篇笔记</button></div></div>${tabBar("library")}`;
    }
    function errorScreen() {
      return `${statusBar()}${nav("笔记", {})}<div class="content"><div class="empty-state"><span class="setting-icon" style="width:52px;height:52px">${icon("alert")}</span><h3>暂时无法加载</h3><p>连接服务器超时。请检查网络后重试，或确认服务器地址仍然可用。</p><button class="primary-button" data-action="retry-connection" style="width:auto">重试</button><button class="text-button" data-go="server">检查服务器设置</button></div></div>${tabBar("library")}`;
    }

    function upScreen() {
      const videos = [
        ["如何用最少的步骤建立长期记忆", "12:48 · 3天前", "阅读", "reader"],
        ["为什么你记得快，也忘得快？", "10:16 · 7天前", "64%", "progress"],
        ["把复杂问题讲清楚的四个步骤", "15:02 · 2周前", "生成", "create"],
        ["我们如何设计一次有效的产品体验", "18:44 · 1个月前", "阅读", "reader"]
      ];
      return `${statusBar()}${nav("UP 主", { inline: true, back: "library", backLabel: "笔记", action: `<button class="icon-button" data-go="distill" aria-label="蒸馏语料">${icon("more")}</button>` })}<div class="content"><div class="content-pad"><div class="author-card"><div class="avatar">何</div><div><h3>老师好我叫何同学</h3><p>326 个视频 · 已生成 28 篇笔记</p></div></div><button class="secondary-button" data-go="distill">蒸馏语料 <span style="color:var(--muted);font-weight:400">实验功能</span></button><div class="search-box">${icon("search")}<span>搜索这个 UP 主的视频</span></div><div class="segmented"><button class="segment active">全部</button><button class="segment">未生成</button><button class="segment">已生成</button></div><div class="section-title"><span>按发布时间</span><span>最近更新</span></div><div class="list">${videos.map(video => `<div class="video-row"><div class="video-thumb">${icon("play")}</div><div class="row-copy"><span class="row-title">${video[0]}</span><div class="meta">${video[1]}</div></div><button class="row-action" data-go="${video[3]}">${video[2]}</button></div>`).join("")}</div></div></div><div class="home-indicator"></div>`;
    }

    function trashScreen() {
      return `${statusBar()}${nav("回收站", { inline: true, back: "settings", backLabel: "设置" })}<div class="content"><div class="content-pad"><p style="margin:0;color:var(--muted);font-size:12px;line-height:1.6">笔记保留 30 天。恢复后会回到资料库；彻底删除无法撤销。</p><div class="section-title"><span>2 篇笔记</span><span>左滑管理</span></div><div class="swipe-demo"><div class="trash-row"><div class="row-copy"><span class="row-title">怎样整理一个长期可用的订阅列表</span><div class="meta">少数派 · 8:24</div></div></div><button class="swipe-action restore" data-action="restore">恢复</button><button class="swipe-action delete" data-action="purge">彻底删除</button></div><div class="trash-row"><div class="row-copy"><span class="row-title">一次关于知识复利的讨论</span><div class="meta">李自然说 · 18:06</div></div><span class="days">剩 12 天</span></div></div></div><div class="home-indicator"></div>`;
    }

    function distillScreen() {
      return `${statusBar()}${nav("蒸馏语料", { inline: true, back: "up", backLabel: "UP 主" })}<div class="content grouped"><div class="content-pad"><div class="detail-head"><h3>老师好我叫何同学</h3><p>从最近 50 个视频提炼主题与观点</p>${status("正在蒸馏")}</div><section class="progress-card"><div class="step current"><span class="step-icon">${icon("up")}</span><div class="step-copy"><strong>已处理 36 / 50 个视频</strong><small>当前：把复杂问题讲清楚的四个步骤</small><div class="progress-track"><span style="width:72%"></span></div></div><span class="step-value">72%</span></div></section><section class="live-preview"><h4>语料预览</h4><p>完成后可在这里查看按主题整理的 Markdown 语料。单篇笔记和任务记录不受蒸馏删除影响。</p></section><button class="secondary-button danger" data-action="cancel-distill">取消蒸馏</button></div></div><div class="home-indicator"></div>`;
    }

    function sheetMarkup() {
      if (!state.sheet) return "";
      const sheets = {
        "reader-menu": `<div class="sheet-head"><h3>阅读操作</h3></div><div class="action-list"><button data-action="directory">本篇目录</button><button data-action="font-size">切换正文字号（当前${state.readerScale > 1 ? "大" : state.readerScale < 1 ? "小" : "标准"}）</button><button data-action="copy-note">复制当前内容</button><button data-action="source">打开来源页面</button><button data-action="regenerate">重新生成笔记</button><button class="danger" data-action="trash-note">移到回收站</button><button class="cancel" data-action="close-sheet">取消</button></div>`,
        "directory": `<div class="sheet-head"><h3>本篇目录</h3></div><button class="directory-link" data-action="directory-target" data-value="section-expression">表达是理解的检验</button><button class="directory-link" data-action="directory-target" data-value="section-example" style="padding-left:14px">从复杂语言回到具体例子</button><button class="directory-link" data-action="directory-target" data-value="section-output" style="padding-left:14px">用输出检查理解</button><div class="action-list"><button class="cancel" data-action="close-sheet">完成</button></div>`,
        "remove-token": `<div class="sheet-head"><h3>移除已保存的 Token？</h3></div><p>只会从这台 iPhone 移除凭据，服务器和其他设备不受影响。</p><div class="action-list"><button class="danger" data-action="confirm-remove-token">移除 Token</button><button class="cancel" data-action="close-sheet">取消</button></div>`,
        "cancel-job": `<div class="sheet-head"><h3>取消这个任务？</h3></div><p>服务器会停止后续处理，已生成的中间结果按现有规则保留。</p><div class="action-list"><button class="danger" data-action="confirm-cancel">取消任务</button><button class="cancel" data-action="close-sheet">继续处理</button></div>`,
        "delete-tasks": `<div class="sheet-head"><h3>删除 ${state.selected.size} 条任务记录？</h3></div><p>已生成的笔记会保留。运行中的任务不包含在本次删除中。</p><div class="action-list"><button class="danger" data-action="confirm-delete">删除任务记录</button><button class="cancel" data-action="close-sheet">取消</button></div>`,
        "regenerate": `<div class="sheet-head"><h3>重新生成笔记？</h3></div><p>使用已有字幕创建一个新任务，当前笔记和任务记录会保留。</p><div class="action-list"><button data-action="confirm-regenerate">重新生成</button><button class="cancel" data-action="close-sheet">取消</button></div>`,
        "purge": `<div class="sheet-head"><h3>彻底删除这篇笔记？</h3></div><p>将删除笔记、字幕、历史版本和导入原件。请输入笔记标题以确认。</p><div class="url-field" style="border-color:var(--danger)"><span>怎样整理一个长期可用的订阅列表</span></div><div class="action-list"><button class="danger" data-action="confirm-purge">彻底删除</button><button class="cancel" data-action="close-sheet">取消</button></div>`
      };
      return `<div class="sheet-backdrop"><section class="sheet"><div class="grabber"></div>${sheets[state.sheet]}</section></div>`;
    }

    function currentScreen() {
      switch (state.screen) {
        case "search": return searchScreen();
        case "reader": return readerScreen();
        case "create": return createScreen() + (state.sheet === "duplicate" ? duplicateSheet() : "");
        case "tasks": return tasksScreen();
        case "progress": return progressScreen();
        case "failed": return failedScreen();
        case "settings": return settingsScreen();
        case "server": return serverScreen(false);
        case "onboarding": return serverScreen(true);
        case "loading": return loadingScreen();
        case "empty": return emptyScreen();
        case "error": return errorScreen();
        case "up": return upScreen();
        case "trash": return trashScreen();
        case "distill": return distillScreen();
        default: return `<div class="screen">${libraryContent()}</div>`;
      }
    }

    function render() {
      const groups = [...new Set(flows.map(flow => flow.group))];
      document.getElementById("flowIndex").innerHTML = groups.map(group => `<div class="flow-group"><span class="flow-label">${group}</span>${flows.filter(flow => flow.group === group).map(flow => `<button class="flow-button ${state.screen === flow.id ? "active" : ""}" data-go="${flow.id}">${icon(flow.icon)}<span>${flow.label}</span></button>`).join("")}</div>`).join("") + `<p class="prototype-caption">基于当前 iOS 客户端与现有 FastAPI 能力设计。示例内容仅用于演示。</p>`;
      document.getElementById("phone").innerHTML = `<div class="screen">${currentScreen()}${state.sheet && state.sheet !== "duplicate" ? sheetMarkup() : ""}${state.toast ? `<div class="toast"><span>${state.toast}</span>${state.toast.includes("删除") || state.toast.includes("回收站") ? `<button data-action="undo">撤销</button>` : ""}</div>` : ""}</div>`;
      const note = notes[state.screen];
      document.getElementById("notesPanel").innerHTML = `<div class="notes-head"><span class="kicker">${flows.find(flow => flow.id === state.screen).group} / 设计说明</span><h2>${note.title}</h2><p>${note.description}</p></div><section class="note-section"><h3>设计决策</h3><ul>${note.decisions.map(item => `<li>${item}</li>`).join("")}</ul></section><section class="note-section"><h3>关键交互</h3><ul>${note.interactions.map(item => `<li>${item}</li>`).join("")}</ul></section><div class="native-note">${note.native}</div>`;
      document.querySelectorAll(".flow-button").forEach(button => button.setAttribute("aria-current", button.classList.contains("active") ? "page" : "false"));
    }

    function go(screen) {
      const previous = state.screen;
      if (screen === "reader") {
        state.readerSearch = previous === "search";
        state.readerBack = ["search", "library", "tasks", "up"].includes(previous) ? previous : "library";
      }
      state.screen = screen;
      state.sheet = null;
      state.toast = "";
      render();
    }
    function setTheme(theme) {
      state.theme = theme;
      if (theme === "system") document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme", theme);
      render();
    }
    function showToast(message) {
      clearTimeout(toastTimer);
      state.toast = message;
      render();
      toastTimer = setTimeout(() => { state.toast = ""; render(); }, 3600);
    }

    document.addEventListener("click", event => {
      const goButton = event.target.closest("[data-go]");
      if (goButton) { go(goButton.dataset.go); return; }
      const button = event.target.closest("[data-action]");
      if (!button) return;
      const action = button.dataset.action;
      if (action === "filter") { state.filter = button.dataset.value; go("library"); }
      if (action === "clear-filter") { state.filter = ""; go("library"); }
      if (action === "task-filter") { state.taskFilter = button.dataset.value; state.selecting = false; render(); }
      if (action === "search-scope") { state.searchScope = button.dataset.value; render(); }
      if (action === "reader-tab") { state.readerTab = button.dataset.value; state.sheet = null; render(); }
      if (action === "theme") setTheme(button.dataset.value);
      if (action === "font-size") { state.readerScale = state.readerScale === 1 ? 1.18 : state.readerScale > 1 ? 0.92 : 1; state.sheet = null; showToast(`正文字号已设为${state.readerScale > 1 ? "大" : state.readerScale < 1 ? "小" : "标准"}`); }
      if (action === "directory-target") { const id = button.dataset.value; state.sheet = null; render(); document.getElementById(id)?.scrollIntoView({ block: "start", behavior: "smooth" }); }
      if (action === "timestamp") showToast(`将在来源页面 ${button.dataset.value} 打开`);
      if (action === "match") showToast("已定位到相邻匹配位置");
      if (action === "source") { state.sheet = null; showToast("将使用 Safari 打开来源页面"); }
      if (action === "load-more") showToast("已加载更多内容");
      if (action === "retry-connection") { go("library"); showToast("已重新连接"); }
      if (action === "confirm-remove-token") { state.hasToken = false; state.connected = false; state.sheet = null; showToast("Token 已从这台 iPhone 移除"); }
      if (action === "delete-tasks" && state.selected.size === 0) { showToast("请先选择要删除的任务"); return; }
      if (action === "toggle-select") { state.selecting = !state.selecting; render(); }
      if (action === "select-task") { const id = Number(button.dataset.id); state.selected.has(id) ? state.selected.delete(id) : state.selected.add(id); render(); }
      if (["reader-menu", "directory", "remove-token", "cancel-job", "delete-tasks", "regenerate", "purge"].includes(action)) { state.sheet = action; render(); }
      if (action === "duplicate") { state.sheet = "duplicate"; render(); }
      if (action === "close-sheet") { state.sheet = null; render(); }
      if (action === "generate" || action === "confirm-regenerate" || action === "retry") { state.canceled = false; go("progress"); showToast(action === "retry" ? "已重新开始任务" : "已加入任务，正在连接实时进度"); }
      if (action === "confirm-cancel") { state.canceled = true; state.sheet = null; showToast("任务已取消"); }
      if (action === "confirm-delete") { state.sheet = null; state.selected.clear(); showToast("已删除任务记录"); }
      if (action === "delete-single") { go("tasks"); showToast("任务记录已删除"); }
      if (action === "restore") { state.sheet = null; showToast("已恢复到全部笔记"); }
      if (action === "trash-note") { state.sheet = null; showToast("已移到回收站"); }
      if (action === "confirm-purge") { state.sheet = null; showToast("笔记已彻底删除"); }
      if (action === "copy-error") showToast("错误详情已复制");
      if (action === "copy-note") { state.sheet = null; showToast("当前内容已复制"); }
      if (action === "cancel-distill") { go("up"); showToast("蒸馏已取消"); }
      if (action === "undo") showToast("已撤销上一步操作");
    });
    document.addEventListener("submit", event => {
      event.preventDefault();
      if (event.target.id === "search-form") {
        state.searchDraft = new FormData(event.target).get("q")?.toString() || "";
        state.submittedQuery = state.searchDraft.trim();
        render();
      }
      if (event.target.id === "server-form") {
        const initial = event.target.dataset.initial === "true";
        state.connected = true;
        state.hasToken = Boolean(document.getElementById("server-token")?.value) || state.hasToken;
        go("settings");
        showToast(initial ? "服务器已连接" : "连接信息已保存");
      }
    });
    document.addEventListener("input", event => {
      if (event.target.id === "search-input") state.searchDraft = event.target.value;
      if (event.target.id === "cue-search") {
        const query = event.target.value.trim();
        document.getElementById("cue-list").innerHTML = cueRows(transcriptCues.filter(([, text]) => text.includes(query)));
      }
      if (["server-address", "server-token"].includes(event.target.id)) {
        const submit = document.getElementById("connect-submit");
        if (submit) submit.hidden = false;
      }
    });
    document.addEventListener("keydown", event => { if (event.key === "Escape" && state.sheet) { state.sheet = null; render(); } });
    render();
  </script>
</body>
</html>
