# One-shot stack: backend + frontend nginx. Configure API_TOKEN / CORS before production (see README).
# Usage:
#   1. cp server/.env.example server/.env && set LLM_API_KEY
#   2. docker compose up --build
#   3. Open http://localhost:5173 ; API http://localhost:17821
#
# Notes:
# - VITE_API_BASE_URL is the browser-side API URL (not the container-internal network).
# - VITE_API_TOKEN is baked from API_TOKEN into frontend JS at build time (weak secret; not for real protection alone).
# - Default server image has no ASR extras (see server/Dockerfile).
# - Frequent Apple Silicon MLX ASR: prefer host launchd — docs/runbooks/macos-service.md

services:
  server:
    build: ./server
    env_file: ./server/.env
    ports:
      - "17821:17821"
    volumes:
      - ./server/data:/app/data
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        # Browser-side URL for API calls (not container-internal).
        #   - Local (browser on compose host): default http://localhost:17821 is enough.
        #   - Remote host: set VITE_API_BASE_URL to the public API origin and rebuild.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:17821}
        # Baked into frontend JS from API_TOKEN (weak secret). Empty = no auth (local only).
        VITE_API_TOKEN: ${API_TOKEN:-}
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped
