<body><div class="shell"><aside class="side"><a class="brand" href="#library">片知</a><div class="prototype">设计原型 · 示例数据</div><nav class="nav"><a data-nav="library" href="#library">资料库</a><a data-nav="new" href="#new">新建笔记</a><a data-nav="task" href="#task">任务</a></nav><div class="scenes"><small>原型场景</small><a href="#empty">空搜索结果</a><a href="#error">搜索局部失败</a></div></aside><header class="mobile-top"><a class="brand" href="#library">片知</a><small>设计原型 · 示例数据</small></header><main class="main"><div class="content" id="app"></div></main></div><nav class="bottom-nav"><a data-nav="library" href="#library">资料库</a><a data-nav="new" href="#new">新建</a><a data-nav="task" href="#task">任务</a></nav>
<script>
const videos=[
{id:'focus',title:'把注意力还给自己：一套可练习的学习方法',author:'慢学实验室',date:'2026-10-18',duration:'18:42',bvid:'BV1DEMO00001',tags:['学习','注意力','费曼'],intro:'注意力不是意志力的竞赛，而是为任务减少切换成本。先把今天唯一要完成的输出写下来，再安排输入。',note:'让注意力有一个明确的落点：今天需要交付什么，而不是还要看多少资料。给一段学习时间设一个小问题，用自己的语言解释它，把卡住的概念写成一句问题。',conclusion:'用费曼式复述完成一次短复盘：先写给初学者看的解释，再补回缺失的例子和证据。',transcript:'当环境减少打断，注意力就不必每次从零恢复。先关掉不会参与当前任务的入口。'},
{id:'systems',title:'做笔记之前，先搭一个能回看的学习系统',author:'纸上工作室',date:'2026-10-12',duration:'12:16',bvid:'BV1DEMO00002',tags:['笔记','复盘'],intro:'把笔记写成未来的自己能接住的上下文：问题、证据、自己的判断。',note:'记录时写下正在解决的问题，再留下原始材料的位置。复盘时先看问题，尝试复述答案，最后再打开笔记核对。',conclusion:'挑一条旧笔记，补上它当时回答的问题。让保存变成下一次思考的起点。',transcript:'一个能回看的系统，不在于分了多少文件夹，而在于每条记录有没有明确的问题。'},
{id:'feynman',title:'费曼技巧：如何确认自己真的学会了',author:'理解力电台',date:'2026-10-05',duration:'09:38',bvid:'BV1DEMO00003',tags:['学习','费曼'],intro:'讲不清的地方，往往就是还没有理解的地方。用自己的话写下解释，再回到原始材料补证据。',note:'费曼练习需要短时、单点的注意力，先解释一个概念，再检查哪一步断了。只选择一个例子，把概念和例子之间的关系讲清楚。',conclusion:'写一段给初学者的解释。删掉只能复述、无法解释的术语，重新查证它们。',transcript:'解释不是把术语换成另一个术语。你需要用一个具体的例子，让对方知道它在什么情境下成立。'}
];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const route=()=>{const raw=location.hash.slice(1)||'library';const i=raw.indexOf('?');return {name:i<0?raw:raw.slice(0,i),p:new URLSearchParams(i<0?'':raw.slice(i+1)),raw}};
const href=(name,params={})=>'#'+name+(Object.keys(params).length?'?'+new URLSearchParams(params):'');
const go=(name,params={})=>{const next=href(name,params);if(location.hash===next)render();else location.hash=next};
const mark=(text,q)=>{if(!q)return esc(text);let i=text.toLowerCase().indexOf(q.toLowerCase());return i<0?esc(text):esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+mark(text.slice(i+q.length),q)};
let current=route().raw;const positions=new Map();const focusTargets=new Map();let failed=false;
const backLink=(back,label)=>`<a class="back" href="#${esc(back)}">← ${label}</a>`;
const backLabel=back=>back.startsWith('search')?'返回搜索结果':back.startsWith('author')?'返回 UP 已保存内容':back.startsWith('note')||back.startsWith('transcript')?'返回笔记':back.startsWith('task')?'返回任务':'返回资料库';
const heading=(title,desc,action='')=>`<div class="heading"><div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`;
const authorLink=v=>`<a class="authorlink" href="${esc(href('author',{id:v.id,back:route().raw}))}">${v.author}</a>`;
const meta=v=>`<div class="meta">${authorLink(v)}<span> · ${v.date} · ${v.duration}</span></div>`;
const detailLink=(v,type='note',extra={})=>href(type,{id:v.id,back:route().raw,...extra});
function searchForm(p){return `<form class="searchbar" id="searchForm"><div class="queryrow"><input id="query" value="${esc(p.get('q'))}" placeholder="搜索资料库" aria-label="搜索资料库"><button class="primary" type="submit">搜索</button></div><p class="searchhint">搜索标题、UP 主、BV 号、标签、笔记或字幕</p><div class="filterrow"><label>范围 <select id="scope" aria-label="搜索范围"><option value="all">全部</option><option value="video">视频信息</option><option value="note">笔记</option><option value="transcript">字幕</option></select></label><label>排序 <select id="sort" aria-label="排序"><option value="relevance">相关性</option><option value="recent">最近保存</option><option value="old">最早保存</option></select></label><a class="textlink clearlink" href="#library">清除条件</a></div></form>`}
function row(v){return `<article class="item"><div><h2><a href="${esc(detailLink(v))}">${v.title}</a></h2>${meta(v)}<div class="tags">${v.tags.map(t=>`<a class="tag" href="${esc(href('search',{q:t,scope:'all'}))}">${t}</a>`).join('')}</div></div><div class="actions"><a class="textlink" href="${esc(detailLink(v))}">查看笔记 →</a></div></article>`}
function library(p){let q=p.get('q')||'',scope=p.get('scope')||'all',sort=p.get('sort')||(q?'relevance':'recent');let items=videos.map(v=>{let hits=[];const includes=t=>t.toLowerCase().includes(q.toLowerCase());if(q){if((scope==='all'||scope==='video')&&includes(v.title+v.author+v.bvid+v.tags.join(' ')))hits.push({type:'video',label:'视频信息',text:v.title+' · '+v.bvid+' · '+v.tags.join(' / ')});if((scope==='all'||scope==='note')&&includes(v.intro+v.note+v.conclusion))hits.push({type:'note',label:'笔记 · 怎么练习',text:includes(v.note)?v.note:v.intro});if((scope==='all'||scope==='transcript')&&includes(v.transcript))hits.push({type:'transcript',label:'字幕 · 06:18',text:v.transcript});}return {v,hits}}).filter(x=>!q||x.hits.length);if(sort==='old')items.reverse();if(q&&sort==='relevance')items.sort((a,b)=>(b.v.bvid===q)-(a.v.bvid===q)||b.hits.length-a.hits.length);
let body= !q?`<div class="section-title">最近保存 <span class="hint">${items.length} 份示例笔记</span></div><div class="list">${items.map(x=>row(x.v)).join('')}</div>`:!items.length?`<section class="empty"><h2>没有找到“${esc(q)}”</h2><p>试试「注意力」「费曼」，或改为搜索全部范围。</p><a class="button" href="${esc(href('search',{q,scope:'all'}))}">搜索全部范围</a> <a class="button primary" href="#library">清除搜索</a></section>`:`<div class="result-meta">当前样例中展示 ${items.length} 个视频 · ${items.reduce((n,x)=>n+x.hits.filter(h=>h.type!=='video').length,0)} 处正文命中</div>${items.map(({v,hits})=>`<section class="group"><h2><a href="${esc(detailLink(v,'note',{q}))}">${mark(v.title,q)}</a></h2>${meta(v)}${hits.filter(h=>h.type==='video').map(h=>`<div class="matchinfo">视频信息命中 · ${mark(h.text,q)}</div>`).join('')}${hits.filter(h=>h.type!=='video').slice(0,2).map(h=>`<div class="excerpt"><small>${h.label}</small><p>${mark(h.text,q)}</p><a class="textlink" href="${esc(detailLink(v,h.type,{q,anchor:h.type==='transcript'?'t0618':'method'}))}">${h.type==='transcript'?'定位字幕':'查看笔记'} →</a></div>`).join('')}${hits.every(h=>h.type==='video')?`<a class="textlink" href="${esc(detailLink(v,'note',{q}))}">查看笔记 →</a>`:''}</section>`).join('')}`;return heading(q?'搜索结果':'资料库',q?'从命中片段，回到完整的上下文。':'保存过的视频、笔记和字幕，在同一处继续阅读。',`<a class="button ${q?'':'primary'}" href="#new">新建笔记</a>`)+searchForm(p)+body}
function detail(type,p){let v=videos.find(v=>v.id===p.get('id'))||videos[0],q=p.get('q')||(p.get('from')==='search'?'注意力':''),back=p.get('back')||(p.get('from')==='search'?'search?q='+encodeURIComponent(q):'library'),note=type==='note',params={id:v.id,back,q};return backLink(back,backLabel(back))+`<header class="detail-head"><div class="eyebrow">视频笔记</div><h1>${v.title}</h1>${meta(v)}<div class="detail-actions"><button id="copy">${note?'复制笔记':'复制字幕'}</button><details class="more"><summary>更多</summary><div><button id="regenerate">重新生成笔记</button><a class="button" href="#task">查看任务记录</a></div></details><button id="video">在 B 站播放 ↗</button></div><div class="status" id="feedback" hidden role="status"></div></header><div class="detail-layout"><article class="reading"><nav class="tabs" aria-label="阅读内容"><a aria-current="${note?'page':'false'}" class="${note?'active':''}" href="${esc(href('note',params))}">笔记</a><a aria-current="${!note?'page':'false'}" class="${!note?'active':''}" href="${esc(href('transcript',params))}">字幕</a></nav>${q?`<div class="notice">来自搜索：${esc(q)} · ${note?'笔记段落':'字幕 06:18'}</div>`:''}${note?`<h2 id="idea">核心想法</h2><p>${mark(v.intro,q)}</p><p>这份笔记整理一个可以实践的小方法：明确问题，再通过输出检验理解。</p><h2 id="method" class="${q?'anchor':''}">怎么练习</h2><p>${mark(v.note,q)}</p><p>练习时保留原始材料的位置。遇到解释不通的地方，再回到字幕中的上下文核对，而不是只记住结论。</p><h2 id="review">带走一件事</h2><p>${mark(v.conclusion,q)}</p><div class="source-note">以上为自编示例，非真实 UP 主内容。</div>`:`<div class="transcript-row" id="t0000"><button class="time" data-time="00:00">00:00</button><div>${esc(v.intro)}</div></div><div class="transcript-row ${q?'anchor':''}" id="t0618"><button class="time" data-time="06:18">06:18</button><div>${mark(v.transcript,q)}</div></div><div class="transcript-row" id="t0942"><button class="time" data-time="09:42">09:42</button><div>${esc(v.conclusion)}</div></div><p class="source-note">字幕与时间均为示例。点击时间可查看外跳说明。</p>`}</article><details class="toc" ${innerWidth>720?'open':''}><summary>本页目录</summary>${(note?[['idea','核心想法'],['method','怎么练习'],['review','带走一件事']]:[['t0000','00:00 开始'],['t0618','06:18 方法'],['t0942','09:42 回顾']]).map(([id,t])=>`<a href="#${id}" data-anchor="${id}">${t}</a>`).join('')}</details></div>`}
function newPage(){return heading('新建笔记','把视频变成可阅读、可查找的笔记。')+`<form class="formbox newform" id="newForm"><label for="url">B 站视频链接或 BV 号</label><div class="urlrow"><input id="url" placeholder="粘贴视频链接" required><button class="primary" type="submit">生成笔记</button></div><p class="hint">此原型只演示流程，不发送生成请求。</p><button type="button" id="sample">填入示例链接</button><div class="status" id="feedback" role="status"></div></form><div class="newhint"><h2>生成后，随时回来读</h2><p>笔记和字幕保存在资料库；任务中可以查看处理进度。</p><a class="textlink" href="#library">浏览示例资料库 →</a></div>`}
function task(){return heading('任务','处理进度与恢复操作，不打断你的阅读。',`<a class="button" href="#library">回资料库</a>`)+`<section class="formbox taskbox"><span class="tag">示例任务</span><h2>${videos[0].title}</h2>${[['done','已读取视频信息','视频标题与来源已获取'],['done','已获取字幕','字幕已准备完成'],[failed?'':'current',failed?'生成笔记失败':'正在生成笔记',failed?'示例：生成服务暂时无法连接，可重试。':'可以离开此页，任务在后台继续。'],['','保存到资料库','生成完成后可阅读笔记']].map(([s,t,d])=>`<div class="task-stage"><i class="dot ${s}"></i><div><strong>${t}</strong><div class="hint">${d}</div></div></div>`).join('')}<div class="detail-actions">${failed?'<button class="primary" id="retry">重试生成</button>':'<a class="button primary" href="#note?id=focus&back=task">查看示例完成结果</a>'}<button id="toggleFail">${failed?'切换为生成中':'查看失败状态'}</button></div><div class="status" id="feedback" role="status"></div></section>`}
function author(p){let v=videos.find(v=>v.id===p.get('id'))||videos[0],back=p.get('back')||'library';return backLink(back,backLabel(back))+heading(v.author,'这位 UP 主的已保存内容 · 自编示例')+`<div class="author-intro">已保存 1 份示例笔记。在线投稿浏览将在独立范围中提供，避免与本地资料混淆。</div><div class="list">${row(v)}</div>`}
function errorPage(){return heading('正文搜索暂时不可用','这是局部失败状态示例。')+`<section class="error"><h2>暂时无法检索笔记和字幕</h2><p>视频信息仍可查看。你可以先浏览资料库，或重试正文搜索。</p><a class="button primary" href="#search?q=注意力">重试搜索</a> <a class="button" href="#library">浏览资料库</a></section><div class="section-title">仍可查看的视频信息</div><div class="list">${row(videos[0])}</div>`}
function feedback(t){let e=document.getElementById('feedback');if(e){e.hidden=false;e.textContent=t}}
function render(){let {name,p,raw}=route();const restoreY=positions.get(raw);if(name==='empty'){p.set('q','一个未收录的词')}let views={library:()=>library(p),search:()=>library(p),empty:()=>library(p),note:()=>detail('note',p),transcript:()=>detail('transcript',p),new:newPage,task,author:()=>author(p),error:errorPage};document.getElementById('app').innerHTML=(views[name]||views.library)();let q=p.get('q')||'';if(document.getElementById('scope'))document.getElementById('scope').value=p.get('scope')||'all';if(document.getElementById('sort'))document.getElementById('sort').value=p.get('sort')||(q?'relevance':'recent');document.querySelectorAll('[data-nav]').forEach(x=>{let active=x.dataset.nav===(name==='new'?'new':name==='task'?'task':'library');x.classList.toggle('active',active);if(active)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')});bind(p,name);requestAnimationFrame(()=>{if(restoreY!==undefined)window.scrollTo(0,restoreY);else if(p.get('anchor'))document.getElementById(p.get('anchor'))?.scrollIntoView();else window.scrollTo(0,0);const target=focusTargets.get(raw);if(target)[...document.querySelectorAll('a')].find(a=>a.getAttribute('href')===target)?.focus({preventScroll:true})});current=raw}
function bind(p,name){let f=document.getElementById('searchForm');const search=()=>{let q=document.getElementById('query').value.trim();go(q?'search':'library',{...(q?{q}:{}),scope:document.getElementById('scope').value,sort:route().name==='library'&&q?'relevance':document.getElementById('sort').value})};if(f){f.onsubmit=e=>{e.preventDefault();search()};document.getElementById('scope').onchange=search;document.getElementById('sort').onchange=search}document.querySelectorAll('[data-anchor]').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.anchor)?.scrollIntoView()});document.querySelectorAll('[data-time]').forEach(a=>a.onclick=()=>feedback('原型说明：正式版将在 B 站播放 '+a.dataset.time+' 对应片段；此处不打开虚构视频。'));let nf=document.getElementById('newForm');if(nf)nf.onsubmit=e=>{e.preventDefault();if(!document.getElementById('url').value.trim()){feedback('请先粘贴视频链接。');return}failed=false;go('task')};let sample=document.getElementById('sample');if(sample)sample.onclick=()=>{document.getElementById('url').value='BV1DEMO00001';feedback('已填入演示 BV 号，提交只展示示例任务。')};let cp=document.getElementById('copy');if(cp)cp.onclick=async()=>{let v=videos.find(v=>v.id===p.get('id'))||videos[0];try{await navigator.clipboard.writeText(name==='note'?[v.title,v.intro,v.note,v.conclusion].join('\n\n'):v.transcript);feedback('已复制示例'+(name==='note'?'笔记':'字幕')+'。')}catch{feedback('未能访问剪贴板，请手动选中复制。')}};let vid=document.getElementById('video');if(vid)vid.onclick=()=>feedback('原型说明：正式版打开对应 B 站视频；此处没有真实视频链接。');let re=document.getElementById('regenerate');if(re)re.onclick=()=>feedback('原型说明：重新生成将复用已有字幕；正式版会展示确认与处理进度。');let toggle=document.getElementById('toggleFail');if(toggle)toggle.onclick=()=>{failed=!failed;render()};let retry=document.getElementById('retry');if(retry)retry.onclick=()=>{failed=false;render();feedback('已切换到示例重试状态，没有发送网络请求。')}}
document.addEventListener('click',e=>{const a=e.target.closest('a');if(a&&!a.dataset.anchor)focusTargets.set(current,a.getAttribute('href'))});window.addEventListener('scroll',()=>positions.set(current,scrollY),{passive:true});window.addEventListener('hashchange',render);render();

</script></body></html>
